<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Sichere Anmeldung · Rclone Sync</title>
  <style>
    :root{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f2f2f7;color:#111;padding:24px}@media(prefers-color-scheme:dark){body{background:#000;color:#fff}}main{width:min(390px,100%);text-align:center}.icon{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 22px;border-radius:20px;background:#20c566;color:#fff;font-size:31px}h1{font-size:27px;letter-spacing:-.03em;margin:0 0 8px}p{color:#777;margin:0 0 24px}button{width:100%;min-height:52px;border:0;border-radius:15px;background:#20c566;color:#fff;font:inherit;font-weight:700}.error{margin-top:18px;color:#e5484d}[hidden]{display:none}
  </style>
</head>
<body data-webauthn-native data-method="<!--WEBAUTHN_METHOD-->" data-app-challenge="<!--WEBAUTHN_APP_CHALLENGE-->">
  <main>
    <div class="icon">✓</div>
    <h1>Sicher mit Rclone Sync verbinden</h1>
    <p>Bestätige die Anmeldung auf dieser Serverdomain. Danach kehrst du automatisch zur App zurück.</p>
    <button type="button" data-webauthn-action="native-login">Anmeldung fortsetzen</button>
    <div class="error" data-webauthn-error hidden></div>
  </main>
  <script src="/static/webauthn.js" defer></script>
</body>
</html>
