name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check app tests
      - name: Format check
        run: python -m ruff format --check app tests
      - name: Tests
        run: python -m pytest -q

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax
        run: bash -n scripts/install.sh
      - name: Shellcheck
        run: shellcheck scripts/install.sh
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Prepare systemd verification paths
        run: |
          sudo groupadd --system rclone-sync
          sudo useradd --system --gid rclone-sync --home-dir /home/rclone-sync rclone-sync
          sudo install -d /opt /home/rclone-sync/.config/rclone /mnt /media /srv
          sudo ln -s "$GITHUB_WORKSPACE" /opt/rclone-sync
          install -d venv/bin data logs temp
          install -m 0755 /bin/true venv/bin/python
          install -m 0755 /bin/true venv/bin/uvicorn
      - name: Verify systemd services and timers
        run: |
          systemd-analyze verify \
            systemd/rclone-sync-web.service \
            systemd/rclone-sync.service \
            systemd/rclone-sync.timer \
            systemd/sync-scheduler.service \
            systemd/sync-scheduler.timer
