name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-ui-results
          path: test-results/
          retention-days: 14
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python scripts/update_dependency_lock.py --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check app tests scripts/runtime_files.py scripts/ios_release_preflight.py
      - name: Format check
        run: python -m ruff format --check app tests scripts/runtime_files.py scripts/ios_release_preflight.py
      - name: Require POSIX security test capabilities
        run: python -c "from scripts.runtime_files import supported; assert supported(), 'POSIX no-follow directory handles are required for the installer security tests'"
      - name: Tests
        run: python -m pytest -q

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shell syntax
        run: bash -n scripts/install.sh
      - name: Shellcheck
        run: shellcheck scripts/install.sh
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/workspace.js
          node --check app/static/sw.js
      - name: Web request regressions
        run: node --test scripts/test_web_requests.cjs
      - name: Prepare systemd verification paths
        run: |
          sudo groupadd --system rclone-sync
          sudo useradd --system --gid rclone-sync --home-dir /home/rclone-sync rclone-sync
          sudo install -d /opt /home/rclone-sync/.config/rclone /mnt /media /srv
          sudo ln -s "$GITHUB_WORKSPACE" /opt/rclone-sync
          install -d venv/bin data logs temp
          install -m 0755 /bin/true venv/bin/python
          install -m 0755 /bin/true venv/bin/uvicorn
      - name: Verify systemd services and timers
        run: |
          systemd-analyze verify \
            systemd/rclone-sync-web.service \
            systemd/rclone-sync.service \
            systemd/rclone-sync.timer \
            systemd/sync-scheduler.service \
            systemd/sync-scheduler.timer

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install isolated DOM test dependencies
        run: npm ci --prefix tests/web --ignore-scripts --no-audit --no-fund
      - name: Check workspace behavior and Alpine integration
        run: npm test --prefix tests/web
