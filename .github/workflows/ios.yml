name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "codemagic.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "codemagic.yaml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate iPhone launch metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' ios/RcloneMobile/Info.plist | grep -qx 'LaunchBackground'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' ios/RcloneMobile/Info.plist >/dev/null
          grep -q 'TARGETED_DEVICE_FAMILY: "1"' ios/project.yml
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/RcloneMobile.xcodeproj \
            -scheme RcloneMobile \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
