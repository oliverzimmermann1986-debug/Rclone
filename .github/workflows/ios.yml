name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "app/main.py"
      - "app/auth.py"
      - "app/auth_contract.py"
      - "app/config_store.py"
      - "app/config_validation.py"
      - "app/db.py"
      - "app/job_definitions.py"
      - "app/jobs/**"
      - "app/security.py"
      - "app/routes/**"
      - "contracts/**"
      - "tests/test_native_login_contract.py"
      - "tests/test_native_read_contract.py"
      - "tests/test_ios_release_version.py"
      - "scripts/ios_release_version.py"
      - "codemagic.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "app/main.py"
      - "app/auth.py"
      - "app/auth_contract.py"
      - "app/config_store.py"
      - "app/config_validation.py"
      - "app/db.py"
      - "app/job_definitions.py"
      - "app/jobs/**"
      - "app/security.py"
      - "app/routes/**"
      - "contracts/**"
      - "tests/test_native_login_contract.py"
      - "tests/test_native_read_contract.py"
      - "tests/test_ios_release_version.py"
      - "scripts/ios_release_version.py"
      - "codemagic.yaml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend contract test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate shared native API contracts and release version tooling
        run: python3 -m pytest tests/test_native_login_contract.py tests/test_native_read_contract.py tests/test_ios_release_version.py
      - name: Install verified pinned XcodeGen
        run: python3 scripts/install_pinned_xcodegen.py --destination "$GITHUB_WORKSPACE/.tools"
      - name: Generate Xcode project
        working-directory: ios
        run: '"$GITHUB_WORKSPACE/.tools/xcodegen/bin/xcodegen" generate'

      - name: Validate iPhone launch metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' ios/RcloneMobile/Info.plist | grep -qx 'LaunchBackground'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' ios/RcloneMobile/Info.plist >/dev/null
          grep -q 'TARGETED_DEVICE_FAMILY: "1"' ios/project.yml
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/RcloneMobile.xcodeproj \
            -scheme RcloneMobile \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"
      - name: Inspect simulator signing for Keychain tests
        if: always()
        run: |
          SIM_APP="$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/RcloneMobile.app"
          if test -d "$SIM_APP"; then
            codesign -d --entitlements :- "$SIM_APP"
          fi
