name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "app/**"
      - "contracts/**"
      - "tests/test_native_*.py"
      - "tests/test_ios_*.py"
      - "tests/test_install_pinned_xcodegen.py"
      - "scripts/ios_release*.py"
      - "scripts/install_pinned_xcodegen.py"
      - "requirements*.txt"
      - "pytest.ini"
      - "scripts/ios_simulator_destination.py"
      - "codemagic.yaml"
      - ".github/workflows/ios.yml"
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend contract test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate native API, security and release contracts
        run: python3 -m pytest tests/test_native_login_contract.py tests/test_native_read_contract.py tests/test_install_pinned_xcodegen.py tests/test_ios_*.py
      - name: Install verified pinned XcodeGen
        run: python3 scripts/install_pinned_xcodegen.py --destination "$GITHUB_WORKSPACE/.tools"
      - name: Generate Xcode project
        working-directory: ios
        run: '"$GITHUB_WORKSPACE/.tools/xcodegen/bin/xcodegen" generate'

      - name: Validate iPhone launch metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' ios/RcloneMobile/Info.plist | grep -qx 'LaunchBackground'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' ios/RcloneMobile/Info.plist >/dev/null
          grep -q 'TARGETED_DEVICE_FAMILY: "1"' ios/project.yml
      - name: Build and run unit tests
        run: |
          set -o pipefail
          SIMULATOR_ID="$(python3 scripts/ios_simulator_destination.py)"
          xcodebuild test \
            -project ios/RcloneMobile.xcodeproj \
            -scheme RcloneMobile \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-xcresult-${{ github.sha }}
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Inspect simulator signing for Keychain tests
        if: always()
        run: |
          SIM_APP="$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/RcloneMobile.app"
          if test -d "$SIM_APP"; then
            codesign -d --entitlements :- "$SIM_APP"
          fi
      - name: Package simulator build and test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-artifacts"
          SIM_APP="$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/RcloneMobile.app"
          if test -d "$SIM_APP"; then
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SIM_APP/Info.plist")"
            ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" \
              "$RUNNER_TEMP/ios-artifacts/Sicherpfad-$VERSION-simulator.zip"
          fi
          if test -d "$RUNNER_TEMP/ios-tests.xcresult"; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/ios-tests.xcresult" \
              --output-path "$RUNNER_TEMP/ios-artifacts/ui-screenshots"
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-tests.xcresult" \
              "$RUNNER_TEMP/ios-artifacts/ios-tests.xcresult.zip"
          fi
      - name: Upload simulator build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sicherpfad-ios-simulator-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-artifacts/
          if-no-files-found: warn
          retention-days: 14
