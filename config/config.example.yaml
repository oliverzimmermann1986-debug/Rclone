# ============================================================
# Sicherpfad Server – Beispielkonfiguration (v3)
# Wird bei Neuinstallation nach data/config.yaml kopiert.
# ============================================================

schema_version: 3

web:
  # Native pCloud-Crypto-Ordner sind über die normale pCloud-API nicht beschreibbar.
  hidden_remote_paths:
    - "pcloud:/Crypto Folder"
  username: admin
  # Installer/CLI setzen ausschließlich password_hash. Kein Klartextpasswort
  # in produktiven Konfigurationen speichern.
  password: ""
  password_hash: ""
  secret_key: ""
  session_version: 1
  session_max_age_seconds: 604800

  # Login-Bremse pro Client-IP, persistent in SQLite.
  login_window_seconds: 300
  login_max_failures: 10
  login_lock_seconds: 900

  # Optional: Passkeys und physische FIDO2-Sicherheitsschlüssel. Beide Werte
  # müssen zur öffentlichen HTTPS-Adresse des Reverse-Proxys passen. Leer = aus.
  # Bei https://backup.example.de wäre die RP-ID backup.example.de.
  webauthn_rp_id: ""
  webauthn_origin: ""

  # Bei direktem HTTP false. Hinter HTTPS-Reverse-Proxy true setzen.
  # "auto" funktioniert nur mit korrekt vertrautem Proxy.
  secure_cookie: false
  # Nur hinter HTTPS aktivieren, z. B. 31536000. Bei HTTP bleibt HSTS aus.
  hsts_seconds: 0
  # In Produktion besser konkrete DNS-Namen/IPs statt "*" verwenden.
  allowed_hosts:
    - "*"
  # Nur diese direkten Proxy-Hops dürfen X-Forwarded-For liefern. Leer bedeutet:
  # Forwarding ignorieren und ausschließlich den Socket-Peer verwenden.
  trusted_proxy_ips: []

  # Der lokale Dateibrowser und Quick-Sync dürfen nur hier zugreifen.
  local_browse_roots:
    - /mnt
    - /media
    - /srv
    - /opt/rclone-sync/data

paths:
  data_dir: /opt/rclone-sync/data
  logs_dir: /opt/rclone-sync/logs
  temp_dir: /opt/rclone-sync/temp
  # Getrennte, private Ablage für ausdrücklich ausgewählte Wiederherstellungen.
  recovery_dir: /opt/rclone-sync/recovery

backup:
  enabled: true
  timezone: Europe/Berlin
  max_parallel: 2
  # Beendet nur echten Stillstand. Unveränderte Statistik-Herzschläge zählen
  # nicht als Fortschritt.
  timeout_hours: 4
  # Optionaler absoluter Not-Aus auch bei Fortschritt; 0 = deaktiviert.
  max_runtime_hours: 0

  # Zusätzliche vollständige Größen-Traversierungen vor/nach jedem Sync.
  # Standardmäßig aus Performance-Gründen deaktiviert.
  collect_pre_post_stats: false

  # Scheduler-Sicherheit: Ein noch nie gelaufenes Pair startet nicht sofort beim
  # ersten beliebigen Timer-Tick, sondern nur nahe seines Cron-Zeitpunkts.
  run_on_first_tick: false
  scheduler_grace_minutes: 15
  scheduler_retry_minutes: 60
  default_schedule: "0 3 * * *"

  # Ausbleib-Alarm: meldet Pairs, deren letzter Erfolg älter ist als ihre
  # max_success_age_hours. Deckt den Fall ab, den ein Fehler-Push nicht
  # sieht: der Lauf startet gar nicht (Timer aus, Scheduler tot, Gast gestoppt).
  # Greift nur bei Pairs mit max_success_age_hours > 0.
  overdue_alerts:
    enabled: true
    repeat_hours: 24   # Wiederholung je Pair, damit der Kanal nicht flutet

  # Vor einem destruktiven sync/bisync wird die Quelle erneut gemessen. Fällt
  # Datei- oder Datenmenge gegenüber dem letzten erfolgreichen Lauf unerwartet
  # stark ab, bleibt der Datenweg in Quarantäne, bis ein Mensch ihn freigibt.
  anomaly_guard:
    enabled: true
    file_drop_percent: 35
    size_drop_percent: 35
    min_baseline_files: 100
    measurement_timeout_seconds: 180

  # Restore-Drill: holt eine Zufallsstichprobe aus dem Ziel zurück und
  # vergleicht sie per Prüfsumme mit der Quelle. Beantwortet die Frage, die ein
  # erfolgreicher Sync NICHT beantwortet: komme ich wieder an die Daten heran?
  #
  # Datenschutz: Die Stichprobe sind Produktivdaten. Sie liegen nur während des
  # Vergleichs unter paths.temp_dir (Modus 0700) und werden danach unbedingt
  # gelöscht — auch bei Abbruch. Weder Job-Summary noch Support-Bundle
  # enthalten Dateiinhalte.
  #
  # Kosten: Jeder Lauf verursacht Egress beim Anbieter. sample_files und
  # max_total_mb begrenzen ihn. max_scan_files deckelt das Listing; wird es
  # erreicht, stammt die Stichprobe nur aus dem gelesenen Teil und das Ergebnis
  # meldet "truncated".
  restore_test:
    enabled: false
    schedule: "manual"     # z. B. "0 5 * * 0" für sonntags 05:00
    sample_files: 20
    max_total_mb: 256
    max_scan_files: 20000

  # Gefährliche freie rclone-Flags werden standardmäßig blockiert. Diese Ausnahme
  # nur nach Code-/Planprüfung aktivieren.
  allow_unsafe_rclone_args: false
  # Filterdateien standardmäßig nur innerhalb paths.data_dir erlauben.
  allow_external_filter_files: false
  # Produktive einseitige sync-Läufe müssen Löschen bewusst freigeben und durch
  # ein endliches max_delete begrenzen.
  require_delete_confirmation: true
  require_max_delete_for_sync: true

  pairs:
    - name: Serien
      # Eine stabile ID wird beim ersten validierten Speichern automatisch
      # ergänzt und trennt Anzeigename von Scheduler-/Historienidentität.
      # Beispiel-Pairs sind absichtlich deaktiviert. Erst Pfade, Mount/Sentinel,
      # Dry-Run und Löschgrenzen prüfen, dann aktivieren.
      enabled: false
      remote: pcloud:/medien/Serien
      local: /mnt/media-nas/Serien
      direction: bisync
      mode: bisync
      schedule: "0 2 * * *"

      # Schutz gegen fehlende, leere oder falsche Mounts.
      min_local_files: 10
      min_remote_files: 10
      min_free_gb: 5
      # Warnung, wenn der letzte Erfolg älter ist; 0 deaktiviert.
      max_success_age_hours: 48
      require_mountpoint: true
      mountpoint: /mnt/media-nas
      # Relative Sentinel-Datei unterhalb des lokalen Pair-Pfads.
      sentinel_file: .rclone-sync-ready
      allow_delete: false
      max_delete: 100

      include: ""
      exclude: |-
        .DS_Store
        Thumbs.db
      filter: ""
      include_file: ""
      exclude_file: ""
      filter_file: ""
      rclone_args: []

    - name: Filme
      enabled: false
      remote: pcloud:/medien/Filme
      local: /mnt/media-nas/Filme
      direction: pull
      # copy löscht nichts im Ziel; sync spiegelt und kann löschen.
      mode: copy
      schedule: "0 4 * * 0"
      min_local_files: 10
      min_remote_files: 10
      min_free_gb: 5
      # Warnung, wenn der letzte Erfolg älter ist; 0 deaktiviert.
      max_success_age_hours: 48
      require_mountpoint: true
      mountpoint: /mnt/media-nas
      sentinel_file: .rclone-sync-ready
      allow_delete: false
      max_delete: 100
      rclone_args: []

    - name: Iphone_backup
      enabled: false
      remote: pcloud:/medien/Iphone_backup
      local: /mnt/media-nas/Iphone_backup
      direction: pull
      mode: copy
      schedule: manual
      min_local_files: 1
      # Zeigt remote auf einen lokalen Pfad, wird min_remote_files auf 1
      # erzwungen (Mount-Drop-Schutz). Bewusst leeres Ziel:
      # allow_empty_remote_target: true
      min_remote_files: 0
      min_free_gb: 1
      max_success_age_hours: 168
      require_mountpoint: true
      mountpoint: /mnt/media-nas
      sentinel_file: .rclone-sync-ready
      rclone_args: []

  rclone_args:
    - --transfers=4
    - --checkers=8

  tuning:
    transfers: 4
    checkers: 8
    retries: 3
    low_level_retries: 10
    stats_interval: 10s
    fast_list: false
    # Globales Löschlimit für sync; pro Pair überschreibbar.
    max_delete: 500

  bwlimit: ""
  immutable: false

  # Bei bisync wird diese Datei als --filters-file eingebunden; bei copy/sync
  # als --filter-from. Änderungen an bisync-Filtern können Resync erfordern.
  filter_file: /opt/rclone-sync/data/rclone-filters.txt

  # Relative Pfade werden auf der jeweiligen Zielseite angelegt.
  # copy/sync: --backup-dir im Ziel; bisync: --backup-dir1/--backup-dir2.
  backup_dir: ""
  backup_dir1: ""
  backup_dir2: ""

  # bisync-spezifisch
  conflict_resolve: auto
  resilient: true
  recover: true
  max_lock: 2m
  # Automatisches --resync bleibt aus: erst Log/Plan prüfen und bewusst starten.
  # Baseline-Resync beim allerersten erfolgreichen bisync-Lauf eines Pairs erlauben.
  auto_resync_first_run: true
  auto_resync: false
  resync_mode: path1

notifications:
  # Native iPhone-Pushs bei Fehlern. AuthKey_XXXXXXXXXX.p8 mit Modus 0600
  # innerhalb von paths.data_dir ablegen. Team-ID und Key-ID stammen aus dem
  # Apple Developer Portal; der Schlüssel selbst gehört nie ins Git-Repository.
  apns:
    enabled: false
    team_id: ""
    key_id: ""
    key_file: /opt/rclone-sync/data/AuthKey_APNS.p8
    topic: de.oliverzimmermann.rclonesync
    timeout_seconds: 10
    # APNs darf Meldungen bei kurzzeitiger Nichterreichbarkeit zwischenspeichern.
    retention_hours: 24
    max_attempts: 8
    # Die App erneuert diese Lease bei jeder Anmeldung/jedem Start. Nach einem
    # Offline-Logout verschwindet ein altes Gerät spätestens nach dieser Frist.
    device_lease_days: 7
    events: [sync_error, mount_check_failed, pair_overdue, restore_test_error, anomaly_blocked, recovery_error]

maintenance:
  auto_prune: true
  job_retention_days: 180
  # Unabhängig vom Alter mindestens diese Zahl Jobs behalten.
  keep_latest_jobs: 500
  log_retention_days: 90

# Proxmox Backup Server: dateibasierte Backups per proxmox-backup-client.
# Voraussetzung im LXC: apt install proxmox-backup-client
# (Repo: deb http://download.proxmox.com/debian/pbs-client <debian-codename> main)
pbs:
  enabled: false
  # user@realm!tokenname@pbs-host:datastore  (API-Token empfohlen)
  repository: ""
  # Secret des API-Tokens bzw. Passwort; in der GUI als ***SET*** maskiert.
  password: ""
  # SHA-256-Fingerprint des PBS-Zertifikats (aa:bb:...), leer = System-CA.
  fingerprint: ""
  # Optionaler Namespace und Backup-ID (Default: Hostname des LXC).
  namespace: ""
  backup_id: ""
  timeout_hours: 4
  # Serverseitiges Aufräumen nach jedem erfolgreichen Lauf (0 = aus).
  keep:
    keep_last: 0
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 0
  targets: []
  #  - name: dokumente
  #    paths:
  #      - /mnt/nas/dokumente
  #    schedule: "0 2 * * *"     # cron oder "manual"
  #    require_mountpoint: true
  #    mountpoint: /mnt/nas
  #    sentinel_file: .rclone-sync-ready
  #    min_files: 1
