workflows:
  ios-testflight:
    name: Rclone Sync · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: rclone-sync-testflight
    environment:
      ios_signing:
        provisioning_profiles:
          - rclone-sync-app-store-push
        certificates:
          - rclone-sync-distribution
      vars:
        XCODE_PROJECT: ios/RcloneMobile.xcodeproj
        XCODE_SCHEME: RcloneMobile
      xcode: 26.4
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Validate release tag and set marketing version
        script: |
          test -n "${CM_TAG:-}" || { echo "TestFlight-Build benötigt einen ios-vX.Y.Z-Tag" >&2; exit 1; }
          python3 "$CM_BUILD_DIR/scripts/ios_release_version.py" \
            "$CM_TAG" "$CM_BUILD_DIR/ios/project.yml" --write
      - name: Install backend contract test dependencies
        script: |
          python3 -m pip install -r "$CM_BUILD_DIR/requirements-dev.txt"
      - name: Validate shared native API contracts and release version tooling
        script: |
          cd "$CM_BUILD_DIR"
          python3 -m pytest tests/test_native_login_contract.py tests/test_native_read_contract.py tests/test_ios_release_version.py
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate
      - name: Apply App Store signing profiles
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Set unique build number
        script: |
          case "${BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo "BUILD_NUMBER muss eine positive Ganzzahl sein" >&2; exit 1 ;;
          esac
          test "$BUILD_NUMBER" -gt 0 || { echo "BUILD_NUMBER muss größer als 0 sein" >&2; exit 1; }
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Verify generated release versions
        script: |
          EXPECTED_VERSION="${CM_TAG#ios-v}"
          SETTINGS="$(xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings)"
          ACTUAL_VERSION="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }')"
          ACTUAL_BUILD="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }')"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_BUILD" = "$BUILD_NUMBER"
      - name: Run iOS unit tests
        script: |
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed iPhone bundle
        script: |
          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -name '*.ipa' -print -quit)"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "${CM_TAG#ios-v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP_PATH/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP_PATH/Info.plist")" = "LaunchBackground"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          codesign -d --entitlements :- "$APP_PATH" > "$VERIFY_DIR/entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$VERIFY_DIR/entitlements.plist")" = "production"
          test -f "$APP_PATH/Assets.car"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
