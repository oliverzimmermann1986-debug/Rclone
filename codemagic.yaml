workflows:
  ios-testflight:
    name: Sicherpfad · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: rclone-sync-testflight
    environment:
      groups:
        - ios-release
      ios_signing:
        provisioning_profiles:
          - rclone-sync-app-store-shared-v2
          - rclone-sync-widget-app-store
        certificates:
          - rclone-sync-distribution
      vars:
        XCODE_PROJECT: ios/RcloneMobile.xcodeproj
        XCODE_SCHEME: RcloneMobile
        IOS_RELEASE_GPG_FINGERPRINT: 47F84407A9D876BCC960973F7E69CA7201C4C7B3
      xcode: 26.4
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Install GnuPG release verifier
        script: |
          brew install gnupg
          GPG_VERSION="$(gpg --version | head -n 1)"
          printf '%s\n' "$GPG_VERSION"
          printf '%s\n' "$GPG_VERSION" | grep -Eq '^gpg \(GnuPG\) 2\.([4-9]|[1-9][0-9])\.' || {
            echo "Nicht unterstützte GnuPG-Version" >&2
            exit 1
          }
      - name: Verify signed release provenance
        script: |
          test -n "${CM_TAG:-}" || { echo "TestFlight-Build benötigt einen ios-vX.Y.Z-Tag" >&2; exit 1; }
          test -n "${IOS_RELEASE_GPG_PUBLIC_KEY_B64:-}" || { echo "Öffentlicher iOS-Release-Signierschlüssel fehlt" >&2; exit 1; }
          export GNUPGHOME="$CM_BUILD_DIR/.tools/release-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["GNUPGHOME"], "release-key.asc").write_bytes(base64.b64decode(os.environ["IOS_RELEASE_GPG_PUBLIC_KEY_B64"], validate=True))'
          chmod 600 "$GNUPGHOME/release-key.asc"
          gpg --batch --quiet --import "$GNUPGHOME/release-key.asc" >/dev/null 2>&1
          IMPORTED_FINGERPRINT="$(gpg --batch --with-colons --fingerprint "$IOS_RELEASE_GPG_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$IMPORTED_FINGERPRINT" = "$IOS_RELEASE_GPG_FINGERPRINT" || { echo "Unerwarteter iOS-Release-Signierschlüssel" >&2; exit 1; }
          git -C "$CM_BUILD_DIR" config --local gpg.format openpgp
          git -C "$CM_BUILD_DIR" config --local gpg.program "$(command -v gpg)"
          if test "$(git -C "$CM_BUILD_DIR" rev-parse --is-shallow-repository)" = "true"; then
            git -C "$CM_BUILD_DIR" fetch --unshallow --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          else
            git -C "$CM_BUILD_DIR" fetch --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          fi
          git -C "$CM_BUILD_DIR" fetch --force --no-tags origin \
            "+refs/tags/$CM_TAG:refs/tags/$CM_TAG"
          python3 "$CM_BUILD_DIR/scripts/ios_release_preflight.py" \
            "$CM_TAG" --repository "$CM_BUILD_DIR"
      - name: Validate release tag and set marketing version
        script: |
          test -n "${CM_TAG:-}" || { echo "TestFlight-Build benötigt einen ios-vX.Y.Z-Tag" >&2; exit 1; }
          python3 "$CM_BUILD_DIR/scripts/ios_release_version.py" \
            "$CM_TAG" "$CM_BUILD_DIR/ios/project.yml" --write
      - name: Install backend contract test dependencies
        script: |
          python3 -m pip install -r "$CM_BUILD_DIR/requirements-dev.txt"
      - name: Validate shared native API contracts and release version tooling
        script: |
          cd "$CM_BUILD_DIR"
          python3 -m pytest tests/test_native_login_contract.py tests/test_native_read_contract.py tests/test_install_pinned_xcodegen.py tests/test_ios_release_preflight.py tests/test_ios_release_version.py tests/test_ios_app_store_release.py
      - name: Install verified pinned XcodeGen
        script: |
          python3 "$CM_BUILD_DIR/scripts/install_pinned_xcodegen.py" \
            --destination "$CM_BUILD_DIR/.tools"
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ios"
          "$CM_BUILD_DIR/.tools/xcodegen/bin/xcodegen" generate
      - name: Apply App Store signing profiles
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Set unique build number
        script: |
          case "${BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo "BUILD_NUMBER muss eine positive Ganzzahl sein" >&2; exit 1 ;;
          esac
          test "$BUILD_NUMBER" -gt 0 || { echo "BUILD_NUMBER muss größer als 0 sein" >&2; exit 1; }
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Verify generated release versions
        script: |
          EXPECTED_VERSION="${CM_TAG#ios-v}"
          SETTINGS="$(xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings)"
          ACTUAL_VERSION="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }')"
          ACTUAL_BUILD="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }')"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_BUILD" = "$BUILD_NUMBER"
      - name: Run iOS unit tests
        script: |
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture localized App Store screenshots
        script: |
          SCREENSHOT_DEVICE="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime in json.load(sys.stdin)["devices"].values() for d in runtime if d.get("isAvailable")]
          preferred = ["iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 17"]
          for name in preferred:
              match = next((d for d in devices if d.get("name") == name), None)
              if match:
                  print(match["udid"])
                  break
          else:
              raise SystemExit("Kein unterstützter iPhone-Simulator gefunden")
          ')"
          xcrun simctl boot "$SCREENSHOT_DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$SCREENSHOT_DEVICE" -b
          SCREENSHOT_DERIVED="$CM_BUILD_DIR/build/store-preview-derived"
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SCREENSHOT_DEVICE" \
            -derivedDataPath "$SCREENSHOT_DERIVED" \
            CODE_SIGNING_ALLOWED=NO
          SCREENSHOT_APP="$(find "$SCREENSHOT_DERIVED/Build/Products" -path '*Release-iphonesimulator/RcloneMobile.app' -print -quit)"
          test -n "$SCREENSHOT_APP"
          xcrun simctl install "$SCREENSHOT_DEVICE" "$SCREENSHOT_APP"
          SCREENSHOT_DIR="$CM_BUILD_DIR/build/app-store-screenshots"
          mkdir -p "$SCREENSHOT_DIR/raw"
          for screen in dashboard vault paths jobs system; do
            xcrun simctl terminate "$SCREENSHOT_DEVICE" de.oliverzimmermann.rclonesync 2>/dev/null || true
            xcrun simctl launch "$SCREENSHOT_DEVICE" de.oliverzimmermann.rclonesync \
              --args -AppleLanguages '(de)' -AppleLocale de_DE --store-preview "$screen" >/dev/null
            sleep 2
            xcrun simctl io "$SCREENSHOT_DEVICE" screenshot "$SCREENSHOT_DIR/raw/$screen.png"
            sips --resampleHeightWidth 2688 1242 "$SCREENSHOT_DIR/raw/$screen.png" \
              --out "$SCREENSHOT_DIR/$screen-1242x2688.png" >/dev/null
          done
          rm -rf "$SCREENSHOT_DIR/raw"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed iPhone bundle
        script: |
          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -name '*.ipa' -print -quit)"
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "${CM_TAG#ios-v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP_PATH/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP_PATH/Info.plist")" = "LaunchBackground"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          codesign -d --entitlements :- "$APP_PATH" > "$VERIFY_DIR/entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$VERIFY_DIR/entitlements.plist")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$VERIFY_DIR/entitlements.plist")" = "group.de.oliverzimmermann.rclonesync"
          WIDGET_PATH="$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          test -n "$WIDGET_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")" = "de.oliverzimmermann.rclonesync.widget"
          codesign -d --entitlements :- "$WIDGET_PATH" > "$VERIFY_DIR/widget-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$VERIFY_DIR/widget-entitlements.plist")" = "group.de.oliverzimmermann.rclonesync"
          test -f "$APP_PATH/Assets.car"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app-store-screenshots/*.png
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
