name: RcloneMobile
options:
  bundleIdPrefix: de.rclonesync
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  RcloneMobile:
    type: application
    platform: iOS
    sources:
      - path: RcloneMobile
    info:
      path: RcloneMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oliverzimmermann.rclonesync
        PRODUCT_NAME: Rclone Sync
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - RcloneMobileTests
  RcloneMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RcloneMobileTests
    dependencies:
      - target: RcloneMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oliverzimmermann.rclonesync.tests
