name: RcloneMobile
options:
  bundleIdPrefix: de.rclonesync
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  RcloneMobile:
    type: application
    platform: iOS
    sources:
      - path: RcloneMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oliverzimmermann.rclonesync
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: RcloneMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: RcloneMobile/RcloneMobile.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - RcloneMobileTests
  RcloneMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RcloneMobileTests
      - path: ../contracts/native_login_contract.json
        buildPhase: resources
      - path: ../contracts/native_read_contract_v1.json
        buildPhase: resources
    dependencies:
      - target: RcloneMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oliverzimmermann.rclonesync.tests
